name: Core checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B /tmp/codex/build/core-ci/pr -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build /tmp/codex/build/core-ci/pr --parallel 2
      - run: ctest --test-dir /tmp/codex/build/core-ci/pr --output-on-failure
