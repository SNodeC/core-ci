<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>core-ci</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <h1>core-ci</h1>
    <p id="session"></p>
    <button id="pause">Pause</button>
    <button id="reconcile">Reconcile</button>
  </header>
  <main>
    <p id="connection" role="status">Connecting</p>
    <p id="reservations"></p>
    <form id="admit">
      <label>Repository <input name="repo" required placeholder="owner/repository"></label>
      <label>Stable tag <input name="tag" required placeholder="v1.2.3"></label>
      <button type="submit">Admit tag</button>
    </form>
    <section aria-labelledby="publications-label">
      <h2 id="publications-label">Publications</h2>
      <ul id="publications"></ul>
    </section>
    <section aria-labelledby="queues-label">
      <h2 id="queues-label">Repository queues</h2>
      <div id="queues"></div>
    </section>
    <section aria-labelledby="matrix-label">
      <h2 id="matrix-label">Packages and targets</h2>
      <label>Filter <input id="filter" type="search" placeholder="Package, version or target"></label>
      <table>
        <thead><tr><th>Package</th><th>Target</th><th>Version</th><th>Status</th><th>Build</th><th>Timings</th><th>Bindings</th><th>Feed commit</th></tr></thead>
        <tbody id="matrix"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
